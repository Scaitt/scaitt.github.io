<style>
  :root {
    --bg: #EEF1F2;
    --surface: #FFFFFF;
    --surface-2: #F6F7F8;
    --fg: #10171D;
    --muted: #5C6B73;
    --border: #D7DEE1;
    --accent: #0B6E6E;
    --accent-fg: #FFFFFF;
    --brand-blue: #1456D6;
    --header-bg: #0A1A1F;
    --header-fg: #E8EFEF;
    --ok-bg: #DCF4E8; --ok-fg: #0F6A3C;
    --warn-bg: #FCF0D8; --warn-fg: #8A5A00;
    --crit-bg: #FBE1DE; --crit-fg: #9C2B1E;
    --info-bg: #E6E6FA; --info-fg: #4B3F9E;

  }

    :root:not([data-theme="light"]) {
      --bg: #0D1417; --surface: #151F23; --surface-2: #1B262B; --fg: #E7EEEF; --muted: #8FA0A6; --border: #2A373C;

      --crit-bg: #3A1512; --crit-fg: #F29A8E; --info-bg: #221F3D; --info-fg: #BDB4F0;
      --neutral-bg: #242E32; --neutral-fg: #AEBBBF; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1417; --surface: #151F23; --surface-2: #1B262B; --fg: #E7EEEF; --muted: #8FA0A6; --border: #2A373C;
    --accent: #2DD4C4; --accent-fg: #06201D; --header-bg: #06100F; --header-fg: #D9F4EE;
    --ok-bg: #123524; --ok-fg: #6FE3A6; --warn-bg: #3A2C0B; --warn-fg: #F2C14E;

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-display); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100%; display: flex; flex-direction: column; }
  button, input, select { font-family: inherit; }

  .tab-btn { appearance: none; border: none; background: transparent; color: var(--header-fg); opacity: 0.6; font-size: 14px; font-weight: 600; padding: 14px 16px; cursor: pointer; border-bottom: 3px solid transparent; }

  .content { flex: 1; padding: 20px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; margin-bottom: 18px; transition: background 0.2s, border-color 0.2s; }
  .card.flash { background: var(--ok-bg); border-color: var(--ok-fg); }
  .card h2 { margin: 0 0 16px; font-size: 18px; font-weight: 700; }
  .btn { appearance: none; border: 1px solid transparent; border-radius: 8px; font-weight: 700; font-size: 15px; padding: 14px 20px; min-height: 52px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-secondary { background: var(--surface-2); color: var(--fg); border-color: var(--border); }
  .btn-outline { background: transparent; border-color: var(--fg); color: var(--fg); }
  .btn-danger { background: var(--crit-fg); color: #FFF; }
  .btn-small { padding: 7px 12px; min-height: auto; font-size: 13px; border-radius: 6px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  input, select { font-size: 18px; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: 8px; min-height: 52px; width: 100%; background: var(--surface); color: var(--fg); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11, 110, 110, 0.25); }
  input[type="file"] { min-height: auto; padding: 10px; font-size: 14px; }
  .scan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--header-bg); color: var(--header-fg); border-radius: 10px; padding: 18px; }
  .kpi .num { font-size: 28px; font-weight: 800; line-height: 1.1; font-family: var(--font-mono); }
  .kpi .label { font-size: 12px; color: var(--header-fg); opacity: 0.65; margin-top: 6px; }
  .history-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; }
  .history-row code { font-family: var(--font-mono); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
  .table-wrap { overflow-x: auto; }
  .table-wrap thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .error-box { background: var(--crit-bg); color: var(--crit-fg); padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .login-wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; background: var(--header-bg); padding: 24px; }
  .login-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 14px; padding: 32px; border: 1px solid var(--border); }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .storage-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .storage-pill.on { background: var(--ok-bg); color: var(--ok-fg); }
  @media (max-width: 760px) {
    .scan-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useRef, useMemo, useEffect, useCallback } = React;

const CENTROS = ['Martorell', 'Baleares', 'CIM Vallés', 'Lleida', 'Manresa'];

const BASE_USERS = [
  { usuario: 'martorell', passwordHash: '87f02245ffb80847b9272b39136f10e30e6ea09a3ed5eb7aa128a354def5aaa2', centro: 'Martorell', role: 'centro' },
  { usuario: 'baleares', passwordHash: '15420dd73407ebad918cf82f711b480a68a7c9ca9ffd65e9ecc955173f00f804', centro: 'Baleares', role: 'centro' },
  { usuario: 'cimvalles', passwordHash: 'e2a7c43241e680029d0522a95b306ae77298c15c1ebd16aaea3a715dd63f4a1a', centro: 'CIM Vallés', role: 'centro' },
  { usuario: 'lleida', passwordHash: '812e6803a171d3545c9c3a1ae2fb88d565f6d1138159e9cbd843b45cc3faf863', centro: 'Lleida', role: 'centro' },
  { usuario: 'manresa', passwordHash: '17a3ee434e2c9b3873684c252851c64bcb906d486d1ccf3d19c38c1b8332ead8', centro: 'Manresa', role: 'centro' },
  { usuario: 'admin', passwordHash: '9c4a8ac7f759f78efa494345bd889a1e9a97c005733a2f173787e8cc5567b1e3', centro: null, role: 'admin' }
];

async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const digest = await window.crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

const USERS_KEY = 'scaitt-users';

function loadUsers() {
  const stored = loadLocal(USERS_KEY, null);
  if (stored && Array.isArray(stored) && stored.length > 0) return stored;
  return BASE_USERS;
}

function saveUsers(list) {
  saveLocal(USERS_KEY, list);
}

const TABS = [
  { id: 'scan', label: 'Lectura / Escáner' },
  { id: 'upload', label: 'Cargar Excel Teórico' },
  { id: 'report', label: 'Informe de Reconciliación' },
  { id: 'settings', label: 'Ajustes / Centro' }
];

const STATUS_META = {
  ok: { label: 'OK', bgVar: '--ok-bg', fgVar: '--ok-fg' },
  descuadre: { label: 'Descuadre cantidad', bgVar: '--warn-bg', fgVar: '--warn-fg' },
  desubicado: { label: 'Desubicado (crítico)', bgVar: '--crit-bg', fgVar: '--crit-fg' },
  inesperado: { label: 'Referencia inesperada', bgVar: '--info-bg', fgVar: '--info-fg' },
  faltante: { label: 'Faltante', bgVar: '--neutral-bg', fgVar: '--neutral-fg' }
};

function slugify(s) {
  return String(s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

function findKey(row, substr) {
  return Object.keys(row).find((k) => k.toLowerCase().indexOf(substr) !== -1);
}

function parseWorkbook(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
  return raw
    .map((row) => {
      const kCentro = findKey(row, 'centro');
      const kUbic = findKey(row, 'ubicac');
      const kRef = findKey(row, 'referenc');
      const kDesc = findKey(row, 'descrip');
      const kCant = findKey(row, 'cantidad');
      return {
        centro: kCentro ? String(row[kCentro]).trim() : '',
        ubicacion: kUbic ? String(row[kUbic]).trim() : '',
        referencia: kRef ? String(row[kRef]).trim() : '',
        descripcion: kDesc ? String(row[kDesc]).trim() : '',
        cantidad: kCant ? (parseFloat(String(row[kCant]).replace(',', '.')) || 0) : 0
      };
    })
    .filter((r) => r.referencia);
}

function computeReconciliation(stock, scans, centro) {
  const theo = stock.filter((r) => r.centro === centro);
  const centroScans = scans.filter((r) => r.centro === centro);

  const scannedMap = {};
  centroScans.forEach((s) => {
    const key = s.ubicacion + '||' + s.referencia;
    scannedMap[key] = (scannedMap[key] || 0) + s.cantidad;
  });
  const scannedByRef = {};
  centroScans.forEach((s) => {
    if (!scannedByRef[s.referencia]) scannedByRef[s.referencia] = {};
    scannedByRef[s.referencia][s.ubicacion] = (scannedByRef[s.referencia][s.ubicacion] || 0) + s.cantidad;
  });

  const used = {};
  const results = [];

  theo.forEach((t) => {
    const key = t.ubicacion + '||' + t.referencia;
    const found = scannedMap[key];
    const base = {
      referencia: t.referencia, descripcion: t.descripcion,
      ubicacionTeorica: t.ubicacion, cantidadTeorica: t.cantidad
    };
    if (found !== undefined) {
      used[key] = true;
      results.push(Object.assign({}, base, {
        status: found === t.cantidad ? 'ok' : 'descuadre',
        ubicacionReal: t.ubicacion, cantidadFisica: found
      }));
    } else {
      const otherLocs = scannedByRef[t.referencia];
      if (otherLocs) {
        const names = Object.keys(otherLocs);
        names.forEach((loc) => { used[loc + '||' + t.referencia] = true; });
        const total = names.reduce((sum, l) => sum + otherLocs[l], 0);
        results.push(Object.assign({}, base, { status: 'desubicado', ubicacionReal: names.join(', '), cantidadFisica: total }));
      } else {
        results.push(Object.assign({}, base, { status: 'faltante', ubicacionReal: '-', cantidadFisica: 0 }));
      }
    }
  });

  const theoRefs = {};
  theo.forEach((t) => { theoRefs[t.referencia] = true; });
  Object.keys(scannedMap).forEach((key) => {
    if (used[key]) return;
    const parts = key.split('||');
    const ubic = parts[0], ref = parts[1];
    if (!theoRefs[ref]) {
      results.push({
        status: 'inesperado', referencia: ref, descripcion: '(no está en el stock teórico)',
        ubicacionTeorica: '-', ubicacionReal: ubic, cantidadTeorica: 0, cantidadFisica: scannedMap[key]
      });
    }
  });

  return results;
}

function loadLocal(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    return fallback;
  }
}

function saveLocal(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* almacenamiento no disponible */ }
}

function Badge({ status }) {
  const meta = STATUS_META[status] || STATUS_META.faltante;
  return (
    <span className="badge" style={{ background: 'var(' + meta.bgVar + ')', color: 'var(' + meta.fgVar + ')' }}>
      {meta.label}
    </span>
  );
}

function LoginScreen({ users, onLogin }) {
  const [usuario, setUsuario] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  const [checking, setChecking] = useState(false);

  const submit = async () => {
    if (!usuario.trim() || !password.trim()) {
      setError('Introduce usuario y contraseña.');
      return;
    }
    setChecking(true);
    const hash = await sha256Hex(password);
    setChecking(false);
    const match = users.find((u) => u.usuario.toLowerCase() === usuario.trim().toLowerCase() && u.passwordHash === hash);
    if (!match) {
      setError('Usuario o contraseña incorrectos.');
      return;
    }
    onLogin({ usuario: match.usuario, centro: match.centro, role: match.role });
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-brand">
          <img src="logo.jpg" alt="SCAITT" className="brand-logo" />
        </div>
        <div className="muted" style={{ fontSize: 12, marginTop: -12, marginBottom: 22 }}>Control de Stock &middot; Inventario físico</div>
        {error && <div className="error-box">{error}</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div className="field">
            <label htmlFor="f-user">Usuario</label>
            <input id="f-user" value={usuario} onChange={(e) => setUsuario(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} placeholder="usuario" />
          </div>
          <div className="field">
            <label htmlFor="f-pass">Contraseña</label>
            <input id="f-pass" type="password" value={password} onChange={(e) => setPassword(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} placeholder="********" />
          </div>
          <button className="btn btn-primary" style={{ marginTop: 6 }} onClick={submit} disabled={checking}>{checking ? 'Comprobando…' : 'Entrar'}</button>
        </div>
      </div>
    </div>
  );
}

function ScanTab({ scans, onSave, onDeleteLast }) {
  const [ubicacion, setUbicacion] = useState('');
  const [referencia, setReferencia] = useState('');
  const [cantidad, setCantidad] = useState('');
  const [flash, setFlash] = useState(false);
  const refUbicacion = useRef(null);
  const refReferencia = useRef(null);
  const refCantidad = useRef(null);
  const audioCtx = useRef(null);
  const flashTimer = useRef(null);

  const beep = () => {
    try {
      if (!audioCtx.current) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx.current = new Ctx();
      }
      const ctx = audioCtx.current;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 1500;
      gain.gain.value = 0.05;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.08);
    } catch (err) { /* audio no soportado */ }
  };

  const [saveError, setSaveError] = useState('');

  const save = () => {
    if (!ubicacion.trim() || !referencia.trim()) {
      setSaveError('Indica ubicación y referencia antes de guardar.');
      return;
    }
    const qty = cantidad.trim() === '' ? 1 : (parseFloat(String(cantidad).replace(',', '.')) || 1);
    setSaveError('');
    onSave({ ubicacion: ubicacion.trim(), referencia: referencia.trim(), cantidad: qty });
    setReferencia('');
    setCantidad('');
    setFlash(true);
    beep();
    clearTimeout(flashTimer.current);
    flashTimer.current = setTimeout(() => setFlash(false), 350);
    setTimeout(() => { if (refReferencia.current) refReferencia.current.focus(); }, 0);
  };

  const recent = scans.slice(0, 5);

  return (
    <React.Fragment>
      <div className={flash ? 'card flash' : 'card'}>
        <h2>Lectura con pistola</h2>
        <div className="scan-grid">
          <div className="field">
            <label htmlFor="in-ubi">1. Ubicación</label>
            <input id="in-ubi" ref={refUbicacion} value={ubicacion}
              onChange={(e) => setUbicacion(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  if (ubicacion.trim()) refReferencia.current && refReferencia.current.focus();
                }
              }}
              placeholder="Escanear ubicación" />
          </div>
          <div className="field">
            <label htmlFor="in-ref">2. Referencia</label>
            <input id="in-ref" ref={refReferencia} value={referencia}
              onChange={(e) => setReferencia(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  e.preventDefault();
                  if (referencia.trim()) {
                    if (refCantidad.current) refCantidad.current.focus();
                  }
                }
              }}
              placeholder="Escanear referencia" />
          </div>
          <div className="field">
            <label htmlFor="in-cant">3. Cantidad</label>
            <input id="in-cant" ref={refCantidad} value={cantidad}
              onChange={(e) => setCantidad(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); } }}
              placeholder="1" />
          </div>
        </div>
        {saveError && <div className="error-box" style={{ marginTop: 16 }}>{saveError}</div>}
        <div style={{ display: 'flex', gap: 12, marginTop: 18, flexWrap: 'wrap', alignItems: 'center' }}>
          <button className="btn btn-primary" onClick={save}>Guardar lectura</button>
          <button className="btn btn-outline" onClick={() => { setUbicacion(''); refUbicacion.current && refUbicacion.current.focus(); }}>
            Limpiar ubicación
          </button>
          <div className="muted" style={{ marginLeft: 'auto' }}>Lecturas registradas: <strong>{scans.length}</strong></div>
        </div>
      </div>

      <div className="card">
        <h2>Últimas lecturas</h2>
        {recent.length === 0 && <div className="muted">Todavía no hay lecturas registradas.</div>}
        {recent.map((r, i) => (
          <div className="history-row" key={r.id}>
            <div><strong>{r.referencia}</strong> &middot; <code>{r.ubicacion}</code> &middot; x{r.cantidad}</div>
            <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
              <span className="muted" style={{ fontSize: 12.5 }}>{new Date(r.ts).toLocaleTimeString()}</span>
              {i === 0 && (
                <button className="btn btn-danger btn-small" onClick={onDeleteLast}>Deshacer</button>
              )}
            </div>
          </div>
        ))}
      </div>
    </React.Fragment>
  );
}

function UploadTab({ stock, fileName, onUpload, onClear }) {
  const [error, setError] = useState('');

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const rows = parseWorkbook(ev.target.result);
        if (rows.length === 0) { setError('No se han encontrado filas válidas en el archivo.'); return; }
        setError('');
        onUpload(rows, file.name);
      } catch (err) {
        setError('Error al leer el archivo: ' + err.message);
      }
    };
    reader.onerror = () => setError('No se ha podido leer el archivo.');
    reader.readAsArrayBuffer(file);
  };

  const totalUnits = stock.reduce((sum, r) => sum + (r.cantidad || 0), 0);
  const totalCentros = new Set(stock.map((r) => r.centro)).size;

  return (
    <div className="card">
      <h2>Cargar stock teórico</h2>
      <p className="muted" style={{ marginTop: -8 }}>
        Columnas esperadas: Centro, Ubicación, Referencia, Descripción, Cantidad Teórica. Admite archivos .xlsx, .xls o .csv exportados desde Excel.
      </p>
      <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} />
      {error && <div className="error-box" style={{ marginTop: 12 }}>{error}</div>}
      {stock.length > 0 && (
        <React.Fragment>
          <div className="kpi-grid" style={{ marginTop: 20 }}>
            <div className="kpi"><div className="num">{stock.length}</div><div className="label">Filas cargadas</div></div>
            <div className="kpi"><div className="num">{totalUnits}</div><div className="label">Unidades teóricas</div></div>
            <div className="kpi"><div className="num">{totalCentros}</div><div className="label">Centros en el archivo</div></div>
            <div className="kpi" style={{ fontSize: 13 }}><div className="num" style={{ fontSize: 16 }}>{fileName || '-'}</div><div className="label">Archivo cargado</div></div>
          </div>
          <div className="table-wrap" style={{ marginTop: 16, maxHeight: 420, overflowY: 'auto' }}>
            <table>
              <thead><tr><th>Centro</th><th>Ubicación</th><th>Referencia</th><th>Descripción</th><th className="num">Cant. Teórica</th></tr></thead>
              <tbody>
                {stock.map((row, i) => (
                  <tr key={i}>
                    <td>{row.centro}</td><td>{row.ubicacion}</td><td>{row.referencia}</td><td>{row.descripcion}</td>
                    <td className="num">{row.cantidad}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button className="btn btn-outline" style={{ marginTop: 16 }} onClick={onClear}>
            Borrar datos cargados
          </button>
        </React.Fragment>
      )}
    </div>
  );
}

function downloadCSV(filename, csv) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function ReportTab({ stock, scans, centro }) {
  const [filter, setFilter] = useState('all');
  const results = useMemo(() => computeReconciliation(stock, scans, centro), [stock, scans, centro]);
  const filtered = filter === 'all' ? results : results.filter((r) => r.status === filter);

  const theoCount = results.filter((r) => r.status !== 'inesperado').length;
  const okCount = results.filter((r) => r.status === 'ok').length;
  const pct = theoCount > 0 ? Math.round((okCount / theoCount) * 100) : 0;
  const desubicadas = results.filter((r) => r.status === 'desubicado').length;
  const faltantes = results.filter((r) => r.status === 'faltante').length;
  const totalLeidos = scans.filter((r) => r.centro === centro).reduce((sum, r) => sum + r.cantidad, 0);

  const exportCSV = () => {
    const header = ['Estado', 'Referencia', 'Descripcion', 'UbicacionTeorica', 'UbicacionReal', 'CantidadTeorica', 'CantidadFisica'];
    const lines = [header.join(';')];
    results.forEach((r) => {
      const meta = STATUS_META[r.status] || STATUS_META.faltante;
      const vals = [meta.label, r.referencia, r.descripcion, r.ubicacionTeorica, r.ubicacionReal, r.cantidadTeorica, r.cantidadFisica];
      lines.push(vals.map((v) => String(v == null ? '' : v).replace(/;/g, ',')).join(';'));
    });
    downloadCSV('reconciliacion_' + centro.replace(/\s+/g, '_') + '.csv', lines.join('\n'));
  };

  return (
    <React.Fragment>
      <div className="kpi-grid">
        <div className="kpi"><div className="num">{totalLeidos}</div><div className="label">Total unidades leídas</div></div>
        <div className="kpi"><div className="num">{pct}%</div><div className="label">% Coincidencia</div></div>
        <div className="kpi"><div className="num">{desubicadas}</div><div className="label">Referencias desubicadas</div></div>
        <div className="kpi"><div className="num">{faltantes}</div><div className="label">Referencias faltantes</div></div>
      </div>
      <div className="card">
        <div className="toolbar">
          <h2 style={{ margin: 0 }}>Informe de reconciliación &mdash; {centro}</h2>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <select value={filter} onChange={(e) => setFilter(e.target.value)}>
              <option value="all">Todos los estados</option>
              <option value="ok">OK</option>
              <option value="descuadre">Descuadre de cantidad</option>
              <option value="desubicado">Desubicado (crítico)</option>
              <option value="inesperado">Referencia inesperada</option>
              <option value="faltante">Faltante</option>
            </select>
            <button className="btn btn-secondary" onClick={exportCSV}>Exportar CSV</button>
          </div>
        </div>
        {filtered.length === 0 && <div className="muted" style={{ padding: '20px 0' }}>Carga el stock teórico y registra lecturas para ver el informe.</div>}
        {filtered.length > 0 && (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Estado</th><th>Referencia</th><th>Descripción</th><th>Ubic. Teórica</th><th>Ubic. Real</th><th className="num">Cant. Teórica</th><th className="num">Cant. Física</th></tr>
              </thead>
              <tbody>
                {filtered.map((row, i) => (
                  <tr key={i}>
                    <td><Badge status={row.status} /></td>
                    <td>{row.referencia}</td><td>{row.descripcion}</td>
                    <td>{row.ubicacionTeorica}</td><td>{row.ubicacionReal}</td>
                    <td className="num">{row.cantidadTeorica}</td><td className="num">{row.cantidadFisica}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

function UsersTab({ users, currentUser, onAdd, onUpdatePassword, onDelete }) {
  const [usuario, setUsuario] = useState('');
  const [password, setPassword] = useState('');
  const [role, setRole] = useState('centro');
  const [centroSel, setCentroSel] = useState(CENTROS[0]);
  const [error, setError] = useState('');
  const [editingPw, setEditingPw] = useState({});
  const [busy, setBusy] = useState(false);

  const submitAdd = async () => {
    const uname = usuario.trim().toLowerCase();
    if (!uname || !password.trim()) { setError('Usuario y contraseña son obligatorios.'); return; }
    if (users.some((u) => u.usuario.toLowerCase() === uname)) { setError('Ya existe un usuario con ese nombre.'); return; }
    setBusy(true);
    const passwordHash = await sha256Hex(password);
    setBusy(false);
    onAdd({ usuario: uname, passwordHash: passwordHash, centro: role === 'admin' ? null : centroSel, role: role });
    setUsuario(''); setPassword(''); setRole('centro'); setCentroSel(CENTROS[0]); setError('');
  };

  const submitPasswordChange = async (usuarioTarget) => {
    const newPw = editingPw[usuarioTarget];
    if (!newPw || !newPw.trim()) return;
    setBusy(true);
    const hash = await sha256Hex(newPw);
    setBusy(false);
    onUpdatePassword(usuarioTarget, hash);
    const next = Object.assign({}, editingPw); delete next[usuarioTarget]; setEditingPw(next);
  };

  return (
    <React.Fragment>
      <div className="card">
        <h2>Añadir usuario</h2>
        {error && <div className="error-box">{error}</div>}
        <div className="scan-grid">
          <div className="field">
            <label htmlFor="nu-user">Usuario</label>
            <input id="nu-user" value={usuario} onChange={(e) => setUsuario(e.target.value)} placeholder="usuario" />
          </div>
          <div className="field">
            <label htmlFor="nu-pass">Contraseña</label>
            <input id="nu-pass" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="contraseña" />
          </div>
          <div className="field">
            <label htmlFor="nu-role">Rol</label>
            <select id="nu-role" value={role} onChange={(e) => setRole(e.target.value)}>
              <option value="centro">Centro</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
        </div>
        {role === 'centro' && (
          <div className="field" style={{ maxWidth: 340, marginTop: 16 }}>
            <label htmlFor="nu-centro">Centro</label>
            <select id="nu-centro" value={centroSel} onChange={(e) => setCentroSel(e.target.value)}>
              {CENTROS.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        )}
        <button className="btn btn-primary" style={{ marginTop: 18 }} onClick={submitAdd} disabled={busy}>{busy ? 'Guardando…' : 'Añadir usuario'}</button>
      </div>

      <div className="card">
        <h2>Usuarios</h2>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Usuario</th><th>Rol</th><th>Centro</th><th>Contraseña</th><th>Acciones</th></tr></thead>
            <tbody>
              {users.map((u) => (
                <tr key={u.usuario}>
                  <td>{u.usuario}</td>
                  <td>{u.role === 'admin' ? <span className="badge" style={{ background: 'var(--info-bg)', color: 'var(--info-fg)' }}>ADMIN</span> : 'Centro'}</td>
                  <td>{u.centro || '-'}</td>
                  <td>
                    {editingPw[u.usuario] === undefined ? (
                      <span className="muted">cifrada</span>
                    ) : (
                      <input style={{ minHeight: 'auto', padding: '6px 8px', fontSize: 13, width: 160 }}
                        placeholder="nueva contraseña"
                        value={editingPw[u.usuario]}
                        onChange={(e) => setEditingPw(Object.assign({}, editingPw, { [u.usuario]: e.target.value }))} />
                    )}
                  </td>
                  <td style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {editingPw[u.usuario] === undefined ? (
                      <React.Fragment>
                        <button className="btn btn-secondary btn-small" onClick={() => setEditingPw(Object.assign({}, editingPw, { [u.usuario]: '' }))}>
                          Cambiar contraseña
                        </button>
                        {u.usuario !== currentUser && (
                          <button className="btn btn-danger btn-small" onClick={() => onDelete(u.usuario)}>Eliminar</button>
                        )}
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <button className="btn btn-primary btn-small" disabled={busy} onClick={() => submitPasswordChange(u.usuario)}>
                          {busy ? 'Guardando…' : 'Guardar'}
                        </button>
                        <button className="btn btn-outline btn-small" onClick={() => {
                          const next = Object.assign({}, editingPw); delete next[u.usuario]; setEditingPw(next);
                        }}>Cancelar</button>
                      </React.Fragment>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="muted" style={{ fontSize: 12, marginTop: 12 }}>
          Las contraseñas se guardan cifradas (SHA-256): ni en este navegador ni en el código fuente se puede leer el texto en claro. Si olvidas una, usa "Cambiar contraseña" para ponerle una nueva.
        </p>
      </div>
    </React.Fragment>
  );
}

function SettingsTab({ user, centro, setCentro, isAdmin, onReset, onLogout }) {
  return (
    <div className="card">
      <h2>Ajustes</h2>
      <div className="field" style={{ maxWidth: 340 }}>
        <label htmlFor={isAdmin ? 'set-centro' : undefined}>{isAdmin ? 'Centro a visualizar' : 'Centro asignado'}</label>
        {isAdmin ? (
          <select id="set-centro" value={centro} onChange={(e) => setCentro(e.target.value)}>
            {CENTROS.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        ) : (
          <div style={{ fontSize: 18, fontWeight: 700, padding: '13px 14px', border: '1.5px solid var(--border)', borderRadius: 8, background: 'var(--surface-2)' }}>
            {centro}
          </div>
        )}
        <div className="muted" style={{ fontSize: 12 }}>
          {isAdmin ? 'Como administrador puedes consultar y editar el stock de cualquier centro.' : 'El centro viene fijado por tu usuario y no se puede cambiar.'}
        </div>
      </div>
      <p className="muted">Usuario conectado: <strong>{user.usuario}</strong>{isAdmin && <React.Fragment> &middot; <span className="badge" style={{ background: 'var(--info-bg)', color: 'var(--info-fg)' }}>ADMIN</span></React.Fragment>}</p>
      <p><span className="storage-pill on">Guardado en este navegador</span></p>
      <p className="muted" style={{ fontSize: 12.5 }}>
        Los datos se guardan en este dispositivo/navegador (localStorage), por centro. Si usas otro ordenador o tablet, o borras los datos de navegación, no verás lo cargado aquí.
      </p>
      <div style={{ display: 'flex', gap: 12, marginTop: 20, flexWrap: 'wrap' }}>
        <button className="btn btn-danger" onClick={onReset}>Borrar stock teórico y lecturas de este centro</button>
        <button className="btn btn-outline" onClick={onLogout}>Cerrar sesión</button>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [centro, setCentro] = useState(null);
  const [activeTab, setActiveTab] = useState('scan');
  const [stock, setStock] = useState([]);
  const [fileName, setFileName] = useState('');
  const [scans, setScans] = useState([]);
  const [users, setUsers] = useState(() => loadUsers());
  const nextId = useRef(1);

  const handleAddUser = useCallback((newUser) => {
    setUsers((prev) => { const next = prev.concat([newUser]); saveUsers(next); return next; });
  }, []);

  const handleUpdatePassword = useCallback((usuario, newPasswordHash) => {
    setUsers((prev) => {
      const next = prev.map((u) => (u.usuario === usuario ? Object.assign({}, u, { passwordHash: newPasswordHash }) : u));
      saveUsers(next);
      return next;
    });
  }, []);

  const handleDeleteUser = useCallback((usuario) => {
    setUsers((prev) => { const next = prev.filter((u) => u.usuario !== usuario); saveUsers(next); return next; });
  }, []);

  const slug = centro ? slugify(centro) : null;

  useEffect(() => {
    if (!slug) return;
    const data = loadLocal('scaitt-centro-' + slug, { stock: [], fileName: '', scans: [] });
    setStock(data.stock || []);
    setFileName(data.fileName || '');
    setScans(data.scans || []);
    const maxId = (data.scans || []).reduce((m, s) => Math.max(m, (s.localId || 0)), 0);
    nextId.current = maxId + 1;
  }, [slug]);

  const persist = useCallback((next) => {
    if (!slug) return;
    saveLocal('scaitt-centro-' + slug, next);
  }, [slug]);

  const isAdmin = user && user.role === 'admin';

  const handleUpload = useCallback((rows, name) => {
    setStock(rows); setFileName(name);
    persist({ stock: rows, fileName: name, scans });
  }, [persist, scans]);

  const handleClearStock = useCallback(() => {
    setStock([]); setFileName('');
    persist({ stock: [], fileName: '', scans });
  }, [persist, scans]);

  const handleSaveScan = useCallback((rec) => {
    const full = Object.assign({ id: 'l' + (nextId.current++), localId: nextId.current, centro, ts: Date.now() }, rec);
    setScans((prev) => {
      const next = [full].concat(prev);
      persist({ stock, fileName, scans: next });
      return next;
    });
  }, [persist, stock, fileName, centro]);

  const handleDeleteLastScan = useCallback(() => {
    setScans((prev) => {
      if (prev.length === 0) return prev;
      const next = prev.slice(1);
      persist({ stock, fileName, scans: next });
      return next;
    });
  }, [persist, stock, fileName]);

  const handleResetAll = useCallback(() => {
    setStock([]); setFileName(''); setScans([]);
    persist({ stock: [], fileName: '', scans: [] });
  }, [persist]);

  if (!user) {
    return <LoginScreen users={users} onLogin={(u) => {
      setUser({ usuario: u.usuario, role: u.role });
      setCentro(u.role === 'admin' ? CENTROS[0] : u.centro);
      setActiveTab('scan');
    }} />;
  }

  return (
    <React.Fragment>
      <div className="app-header">
        <img src="logo.jpg" alt="SCAITT" className="brand-logo-header" />
        <div className="subbrand" style={{ marginLeft: -2 }}>Control de Stock</div>
        <div className="user-chip" style={{ marginLeft: 18 }}>{user.usuario}</div>
        <button className="centro-pill" onClick={() => setActiveTab('settings')}>{centro}</button>
      </div>
      <div className="tabs">
        {TABS.concat(isAdmin ? [{ id: 'users', label: 'Usuarios' }] : []).map((t) => (
          <button key={t.id} className={activeTab === t.id ? 'tab-btn active' : 'tab-btn'} onClick={() => setActiveTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>
      <div className="content">
        {activeTab === 'scan' && <ScanTab scans={scans} onSave={handleSaveScan} onDeleteLast={handleDeleteLastScan} />}
        {activeTab === 'upload' && <UploadTab stock={stock} fileName={fileName} onUpload={handleUpload} onClear={handleClearStock} />}
        {activeTab === 'report' && <ReportTab stock={stock} scans={scans} centro={centro} />}
        {activeTab === 'users' && isAdmin && (
          <UsersTab
            users={users} currentUser={user.usuario}
            onAdd={handleAddUser} onUpdatePassword={handleUpdatePassword} onDelete={handleDeleteUser}
          />
        )}
        {activeTab === 'settings' && (
          <SettingsTab
            user={user} centro={centro} setCentro={setCentro} isAdmin={isAdmin}
            onReset={handleResetAll} onLogout={() => { setUser(null); setCentro(null); }}
          />
        )}
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
